---
- name: Install RPM Fusion free repository
  ansible.builtin.dnf5:
    name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  tags: base

- name: Install RPM Fusion nonfree repository
  ansible.builtin.dnf5:
    name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  tags: base

- name: Configure dnf max parallel downloads
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^max_parallel_downloads='
    line: 'max_parallel_downloads=10'
    insertafter: '^\[main\]'
  tags: base

- name: Configure dnf default yes
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^defaultyes='
    line: 'defaultyes=True'
    insertafter: '^\[main\]'
  tags: base

- name: Update all packages
  ansible.builtin.dnf5:
    name: "*"
    state: latest
  tags: base

- name: Install essential CLI tools
  ansible.builtin.dnf5:
    name: "{{ base_cli_packages }}"
    state: present
  tags: base

- name: Install firewalld
  ansible.builtin.dnf5:
    name: firewalld
    state: present
  tags: base

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
  tags: base

- name: Install flatpak
  ansible.builtin.dnf5:
    name: flatpak
    state: present
  tags: base

- name: Add Flathub remote
  ansible.builtin.command:
    cmd: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  changed_when: false
  tags: base

- name: Install virtualization group
  ansible.builtin.dnf5:
    name: "@virtualization"
    state: present
  tags: base

- name: Enable and start libvirtd
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started
  tags: base

- name: Add user to libvirt group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: libvirt
    append: true
  tags: base

- name: Install os-prober
  ansible.builtin.dnf5:
    name: os-prober
    state: present
  when: enable_os_prober | bool
  tags: base

- name: Enable os-prober in GRUB config
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_DISABLE_OS_PROBER='
    line: 'GRUB_DISABLE_OS_PROBER=false'
  when: enable_os_prober | bool
  register: grub_os_prober
  tags: base

- name: Regenerate GRUB config
  ansible.builtin.command:
    cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
  when: enable_os_prober | bool and grub_os_prober is changed
  tags: base
