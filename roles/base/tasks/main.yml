---
- name: Import RPM Fusion free GPG key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ base_rpmfusion_free_key_url }}"
  tags: base

- name: Import RPM Fusion nonfree GPG key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ base_rpmfusion_nonfree_key_url }}"
  tags: base

- name: Install RPM Fusion free repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
  tags: base

- name: Install RPM Fusion nonfree repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
    state: present
  tags: base

- name: Configure dnf max parallel downloads
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^max_parallel_downloads='
    line: 'max_parallel_downloads=10'
    insertafter: '^\[main\]'
  tags: base

- name: Configure dnf default yes
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^defaultyes='
    line: 'defaultyes=True'
    insertafter: '^\[main\]'
  tags: base

- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
  tags: base

- name: Install essential CLI tools
  ansible.builtin.dnf:
    name: "{{ base_cli_packages }}"
    state: present
  tags: base

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  tags: base

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
  tags: base

- name: Check if RDP service is allowed in firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --query-service=rdp
  register: rdp_check
  failed_when: false
  changed_when: false
  when: firewall_allow_rdp | bool
  tags: base

- name: Allow RDP in firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --add-service=rdp
  notify: Reload firewalld
  when:
    - firewall_allow_rdp | bool
    - rdp_check.rc != 0
  tags: base

- name: Check if SSH service is allowed in firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --query-service=ssh
  register: ssh_check
  failed_when: false
  changed_when: false
  when: firewall_allow_ssh | bool
  tags: base

- name: Allow SSH in firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --add-service=ssh
  notify: Reload firewalld
  when:
    - firewall_allow_ssh | bool
    - ssh_check.rc != 0
  tags: base

- name: Check if custom TCP port is allowed in firewalld
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --query-port={{ item }}/tcp"
  register: firewall_port_checks
  failed_when: false
  changed_when: false
  loop: "{{ firewall_tcp_ports }}"
  tags: base

- name: Allow custom TCP ports in firewalld
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-port={{ item.item }}/tcp"
  notify: Reload firewalld
  when: item.rc != 0
  loop: "{{ firewall_port_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}/tcp"
  tags: base

- name: Install flatpak
  ansible.builtin.dnf:
    name: flatpak
    state: present
  tags: base

- name: Add Flathub remote
  ansible.builtin.command:
    cmd: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  changed_when: false
  tags: base

- name: Install virtualization group
  ansible.builtin.dnf:
    name: "@virtualization"
    state: present
  tags: base

- name: Enable and start libvirtd
  ansible.builtin.systemd_service:
    name: libvirtd
    enabled: true
    state: started
  tags: base

- name: Add user to libvirt group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: libvirt
    append: true
  tags: base

- name: Install os-prober
  ansible.builtin.dnf:
    name: os-prober
    state: present
  when: enable_os_prober | bool
  tags: base

- name: Enable os-prober in GRUB config
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_DISABLE_OS_PROBER='
    line: 'GRUB_DISABLE_OS_PROBER=false'
  notify: Regenerate GRUB config
  when: enable_os_prober | bool
  tags: base

- name: Set GRUB timeout for dual-boot menu
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_TIMEOUT='
    line: 'GRUB_TIMEOUT=5'
  notify: Regenerate GRUB config
  when: enable_os_prober | bool
  tags: base

- name: Show GRUB menu instead of hiding it
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_TIMEOUT_STYLE='
    line: 'GRUB_TIMEOUT_STYLE=menu'
  notify: Regenerate GRUB config
  when: enable_os_prober | bool
  tags: base

- name: Check GRUB menu_auto_hide setting
  ansible.builtin.command:
    cmd: grub2-editenv - list
  register: grubenv_list
  changed_when: false
  when: enable_os_prober | bool
  tags: base

- name: Disable GRUB menu auto-hide
  ansible.builtin.command:
    cmd: grub2-editenv - unset menu_auto_hide
  when:
    - enable_os_prober | bool
    - "'menu_auto_hide=' in grubenv_list.stdout"
  notify: Regenerate GRUB config
  tags: base
