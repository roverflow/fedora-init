---
devtools_c_groups:
  - "@c-development"
  - "@development-tools"

devtools_c_packages:
  - kernel-devel
  - kernel-headers
  - glibc-devel
  - libstdc++-devel
  - zlib-devel
  - bzip2-devel
  - readline-devel
  - sqlite-devel
  - openssl-devel
  - libffi-devel
  - xz-devel
  - tk-devel

devtools_packaging_packages:
  - mock
  - rpm-build
  - rpmdevtools
  - fedora-packager
  - fedpkg

devtools_install_rust: true
devtools_install_nvm: true
devtools_install_gvm: true
devtools_install_pyenv: true

devtools_nvm_install_url: "https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh"
devtools_gvm_install_url: "https://raw.githubusercontent.com/moovweb/gvm/dd652539fa4b771840846f8319fad303c7d0a8d2/binscripts/gvm-installer"
devtools_pyenv_install_url: "https://raw.githubusercontent.com/pyenv/pyenv-installer/63a9e6a216796aeba2535a3bac8e79ba5d95166d/bin/pyenv-installer"
