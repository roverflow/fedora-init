---
- name: Install C/C++ development groups
  ansible.builtin.dnf:
    name: "{{ devtools_c_groups }}"
    state: present
  tags: devtools

- name: Install additional development libraries
  ansible.builtin.dnf:
    name: "{{ devtools_c_packages }}"
    state: present
  tags: devtools

- name: Install packaging and build tools
  ansible.builtin.dnf:
    name: "{{ devtools_packaging_packages }}"
    state: present
  tags: devtools

- name: Add user to mock group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: mock
    append: true
  tags: devtools

# --- Rust via rustup ---

- name: Check if rustup is installed
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.rustup"
  register: rustup_dir
  when: devtools_install_rust
  tags: devtools

- name: Download rustup installer
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: "0755"
  when: devtools_install_rust and not rustup_dir.stat.exists
  tags: devtools

- name: Install rustup
  ansible.builtin.command:
    cmd: sh /tmp/rustup-init.sh -y
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_user_home }}"
  when: devtools_install_rust and not rustup_dir.stat.exists
  tags: devtools

- name: Clean up rustup installer
  ansible.builtin.file:
    path: /tmp/rustup-init.sh
    state: absent
  when: devtools_install_rust
  tags: devtools

# --- nvm ---

- name: Check if nvm is installed
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.nvm"
  register: nvm_dir
  when: devtools_install_nvm
