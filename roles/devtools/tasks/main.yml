- name: Download nvm install script
  ansible.builtin.get_url:
    url: "{{ devtools_nvm_install_url }}"
    dest: /tmp/nvm-install.sh
    mode: "0755"
  when: devtools_install_nvm and not nvm_dir.stat.exists
  tags: devtools

- name: Install nvm
  ansible.builtin.command:
    cmd: bash /tmp/nvm-install.sh
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_user_home }}"
  when: devtools_install_nvm and not nvm_dir.stat.exists
  tags: devtools

- name: Clean up nvm installer
  ansible.builtin.file:
    path: /tmp/nvm-install.sh
    state: absent
  when: devtools_install_nvm
  tags: devtools

# --- gvm ---

- name: Install gvm dependencies
  ansible.builtin.dnf:
    name:
      - bison
      - mercurial
    state: present
  when: devtools_install_gvm
  tags: devtools

- name: Check if gvm is installed
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.gvm"
  register: gvm_dir
  when: devtools_install_gvm
  tags: devtools

- name: Download gvm install script
  ansible.builtin.get_url:
    url: "{{ devtools_gvm_install_url }}"
    dest: /tmp/gvm-installer.sh
    mode: "0755"
  when: devtools_install_gvm and not gvm_dir.stat.exists
  tags: devtools

- name: Install gvm
  ansible.builtin.command:
    cmd: bash /tmp/gvm-installer.sh
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_user_home }}"
  when: devtools_install_gvm and not gvm_dir.stat.exists
  tags: devtools

- name: Clean up gvm installer
  ansible.builtin.file:
    path: /tmp/gvm-installer.sh
    state: absent
  when: devtools_install_gvm
  tags: devtools

# --- pyenv ---

- name: Check if pyenv is installed
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.pyenv"
  register: pyenv_dir
  when: devtools_install_pyenv
  tags: devtools

- name: Download pyenv installer
  ansible.builtin.get_url:
    url: "{{ devtools_pyenv_install_url }}"
    dest: /tmp/pyenv-installer.sh
    mode: "0755"
  when: devtools_install_pyenv and not pyenv_dir.stat.exists
  tags: devtools

- name: Install pyenv
  ansible.builtin.command:
    cmd: bash /tmp/pyenv-installer.sh
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_user_home }}"
  when: devtools_install_pyenv and not pyenv_dir.stat.exists
  tags: devtools

- name: Clean up pyenv installer
  ansible.builtin.file:
    path: /tmp/pyenv-installer.sh
    state: absent
  when: devtools_install_pyenv
  tags: devtools

# --- Ensure version managers are available in zsh ---

- name: Ensure rustup is sourced in zshrc
  ansible.builtin.blockinfile:
    path: "{{ target_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: rustup"
    block: |
      [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
    create: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
  when: devtools_install_rust
  tags: devtools

- name: Ensure nvm is sourced in zshrc
  ansible.builtin.blockinfile:
    path: "{{ target_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: nvm"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    create: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
  when: devtools_install_nvm
  tags: devtools

- name: Ensure gvm is sourced in zshrc
  ansible.builtin.blockinfile:
    path: "{{ target_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: gvm"
    block: |
      [[ -s "$HOME/.gvm/scripts/gvm" ]] && source "$HOME/.gvm/scripts/gvm"
    create: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
  when: devtools_install_gvm
  tags: devtools

- name: Ensure pyenv is sourced in zshrc
  ansible.builtin.blockinfile:
    path: "{{ target_user_home }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: pyenv"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      [[ -d "$PYENV_ROOT/bin" ]] && export PATH="$PYENV_ROOT/bin:$PATH"
      command -v pyenv >/dev/null && eval "$(pyenv init - zsh)"
    create: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
  when: devtools_install_pyenv
  tags: devtools
