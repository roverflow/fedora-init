---
- name: Fedora Desktop Setup
  hosts: localhost
  connection: local
  become: true

  roles:
    - role: base
      tags: base

    - role: nvidia
      tags: nvidia
      when: enable_nvidia | bool

    - role: desktop
      tags: desktop

    - role: gaming
      tags: gaming

    - role: devtools
      tags: devtools

    - role: multimedia
      tags: multimedia

    - role: language
      tags: language

  post_tasks:
    - name: Notify reboot required
      ansible.builtin.debug:
        msg: "Setup complete! A reboot is required to apply all changes. Run: sudo reboot"
      tags: always

    - name: Prompt for reboot
      ansible.builtin.pause:
        prompt: "Reboot now? (yes/no)"
      register: reboot_prompt
      tags: always

    - name: Reboot system
      ansible.builtin.command:
        cmd: systemctl reboot
      when: reboot_prompt.user_input | lower == 'yes'
      tags: always
